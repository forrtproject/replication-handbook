name: Build PR review site

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# One build at a time; each build covers all open PRs anyway.
concurrency:
  group: pr-review-site
  cancel-in-progress: true

jobs:
  build-deploy:
    # Fork PRs get a read-only token, so the site could not be published, and
    # their sources would be executed by the renderer. Skip them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - run: Rscript -e 'install.packages(c("dplyr", "knitr", "rmarkdown", "ggplot2", "readr"))'

      - name: Build the review site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr-review/build_review.py --out docs/pr-review

      - name: Commit and push the review site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/pr-review
          if git diff --quiet --cached; then
            echo "Review site unchanged"
            exit 0
          fi
          git commit -m "Update PR review site [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed (attempt $attempt), retrying"
            sleep 10
          done
          exit 1

      - name: Summary
        run: |
          echo "Review site: https://forrt.org/replication-handbook/pr-review/" >> "$GITHUB_STEP_SUMMARY"
